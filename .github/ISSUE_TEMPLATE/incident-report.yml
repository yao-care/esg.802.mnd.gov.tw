name: "職災/異常事件通報"
description: "通報職業安全衛生事件"
labels: ["incident", "S2-職業安全"]
body:
  - type: input
    id: incident_date
    attributes:
      label: 事件日期
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: input
    id: incident_time
    attributes:
      label: 事件時間
      placeholder: "HH:MM"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 事件地點
      placeholder: "例：急診室、3F 病房走廊"
    validations:
      required: true
  - type: dropdown
    id: incident_type
    attributes:
      label: 事件類型
      options:
        - 針扎
        - 跌倒
        - 化學暴露
        - 放射線暴露
        - 暴力事件
        - 感染暴露
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 事件描述
      placeholder: "詳述事件經過"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 嚴重程度
      options:
        - 輕微(無需就醫)
        - 中度(需就醫)
        - 嚴重(住院/失能)
    validations:
      required: true
  - type: textarea
    id: immediate_action
    attributes:
      label: 立即處置措施
      placeholder: "已採取之緊急處置"
    validations:
      required: true
  - type: input
    id: reporter_name
    attributes:
      label: 通報人姓名
    validations:
      required: true
  - type: input
    id: reporter_unit
    attributes:
      label: 通報人單位
    validations:
      required: true
